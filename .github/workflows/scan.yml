# Runs every 6 hours: national Pick-n-Pull + LKQ Pick Your Part + Pull-A-Part +
# Utah chains, updates inventory_live.json (+ per-yard price lists), records
# history to inventory_history.db, sends push (ntfy) + email digest on watchlist hits.
# Repo secrets: NTFY_TOPIC (phone push), SMTP_USER / SMTP_PASS / ALERT_EMAIL (email, optional).
# Commit scraper/watchlist.json to the repo for CI alerts to fire.

name: Junkyard Scan

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: junkyard-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The history DB is too big to commit to a public repo (31MB+, grows every
      # run) — persist it (plus the alert-dedup file) via the Actions cache instead.
      - name: Restore scan state
        uses: actions/cache@v4
        with:
          path: |
            scraper/inventory_history.db
            scraper/watch_alerted.json
          key: scan-state-${{ github.run_id }}
          restore-keys: scan-state-

      - name: Install dependencies
        run: pip install requests beautifulsoup4 rich

      - name: Refresh per-yard price lists
        run: python scraper/junkyard_scraper.py --refresh-chain-pricing

      - name: Run scraper (national, incremental VIN decode)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Per-run cap on NEW VIN decodes (cached VINs are free). The initial
          # ~40-160k backlog drains across successive 6-hour runs, newest
          # arrivals first; steady-state runs only decode the day's arrivals.
          VPIC_MAX_PER_RUN: "5000"
        run: python scraper/junkyard_scraper.py --save --all --national --decode-vins-incremental

      - name: Commit and push inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # vin_decodes.json.gz is the decode cache's disaster-insurance backup;
          # the scraper only rewrites it after ~20k new decodes, so most runs
          # see no change here.
          git add docs/data/inventory_live.json docs/data/picknpull_pricing.json docs/data/pyp_pricing.json docs/data/pap_pricing.json docs/data/vin_decodes.json.gz
          if git diff --staged --quiet; then
            echo "No inventory changes."
          else
            git commit -m "chore: auto-scan inventory (national)"
            # Rebase in case anything landed on main while the scan was running.
            git pull --rebase origin main
            git push
          fi
