# Read-only: what App Store Connect currently says about YardScout — each
# version's state, the build attached, and any review submission in flight.
# Uses the same API key the release workflow uses; prints nothing secret.
name: App Store status

on:
  workflow_dispatch:
    inputs:
      tester_email:
        description: "Optional: an Apple ID email to look up among this app's beta testers. It is masked and never printed; the log only says whether it was found and its group/state."
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
      BUNDLE_ID: com.benvuolo.yardscout
    steps:
      - name: Mask the lookup email
        run: |
          set -euo pipefail
          e=$(python3 -c "import json,os; print((json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs') or {}).get('tester_email','').strip().lower())")
          if [ -n "$e" ]; then echo "::add-mask::$e"; echo "LOOKUP_EMAIL=$e" >> "$GITHUB_ENV"; fi
      - name: Query App Store Connect
        run: |
          set -euo pipefail
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          key = os.environ["ASC_P8"].strip().replace("\\n", "\n")
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}
          API = "https://api.appstoreconnect.apple.com/v1"
          for a in requests.get(f"{API}/apps", headers=H, params={"limit": 50}, timeout=60).json().get("data", []):
              lb = requests.get(f"{API}/builds", headers=H, params={"filter[app]": a["id"], "sort": "-uploadedDate", "limit": 1,
                                "include": "preReleaseVersion"}, timeout=60).json()
              pv = next((i["attributes"].get("version") for i in lb.get("included", []) if i["type"] == "preReleaseVersions"), "-")
              ub = (lb.get("data") or [{}])[0].get("attributes", {})
              print(f"account app: {a['attributes']['name']} bundle={a['attributes']['bundleId']} latest build {pv} ({ub.get('version','-')}) uploaded={ub.get('uploadedDate','')[:10]}")
          look = os.environ.get("LOOKUP_EMAIL", "")
          if look:
              r = requests.get(f"{API}/betaTesters", headers=H, params={"filter[email]": look, "include": "betaGroups,apps"}, timeout=60)
              data = r.json().get("data", []) if r.status_code == 200 else []
              if r.status_code != 200: print(f"lookup email: HTTP {r.status_code}")
              elif not data: print("lookup email: NOT a beta tester on this account")
              for t in data:
                  inc = {(i["type"], i["id"]): i for i in r.json().get("included", [])}
                  gs = [inc.get(("betaGroups", g["id"]), {}).get("attributes", {}).get("name", "?") for g in (t.get("relationships", {}).get("betaGroups", {}).get("data") or [])]
                  print(f"lookup email: found, inviteType={t['attributes'].get('inviteType')} state={t['attributes'].get('state')} groups={gs}")
              u = requests.get(f"{API}/users", headers=H, params={"filter[username]": look}, timeout=60)
              if u.status_code == 200:
                  ud = u.json().get("data", [])
                  print(f"lookup email: App Store Connect user={'yes, roles=' + str(ud[0]['attributes'].get('roles')) if ud else 'no'}")
              else:
                  print(f"lookup email: users API HTTP {u.status_code}")
          app = requests.get(f"{API}/apps", headers=H, params={"filter[bundleId]": os.environ["BUNDLE_ID"]}, timeout=60).json()["data"][0]
          print("app:", app["attributes"]["name"], app["id"])
          vs = requests.get(f"{API}/apps/{app['id']}/appStoreVersions", headers=H,
                            params={"filter[platform]": "IOS", "limit": 6, "include": "build", "fields[builds]": "version,processingState"}, timeout=60).json()
          builds = {b["id"]: b["attributes"] for b in vs.get("included", []) if b["type"] == "builds"}
          for v in vs["data"]:
              a = v["attributes"]; b = (v.get("relationships", {}).get("build", {}).get("data") or {}).get("id")
              print(f"version {a['versionString']:>7}  state={a['appStoreState']:<28} build={builds.get(b, {}).get('version', '-')}  created={a.get('createdDate','')[:10]}")
          subs = requests.get(f"{API}/apps/{app['id']}/reviewSubmissions", headers=H, params={"limit": 5}, timeout=60).json().get("data", [])
          for s in subs:
              print("review submission:", s["attributes"].get("state"), "submitted", (s["attributes"].get("submittedDate") or "")[:16])
          if not subs: print("review submissions: none")
          bl = requests.get(f"{API}/builds", headers=H, params={"filter[app]": app["id"], "sort": "-uploadedDate", "limit": 6,
                            "include": "buildBetaDetail,preReleaseVersion,betaGroups"}, timeout=60).json()
          inc = {(i["type"], i["id"]): i for i in bl.get("included", [])}
          for b in bl.get("data", []):
              a = b["attributes"]; rel = b.get("relationships", {})
              pv = inc.get(("preReleaseVersions", (rel.get("preReleaseVersion", {}).get("data") or {}).get("id")), {}).get("attributes", {}).get("version", "?")
              bd = inc.get(("buildBetaDetails", (rel.get("buildBetaDetail", {}).get("data") or {}).get("id")), {}).get("attributes", {})
              groups = [inc.get(("betaGroups", g["id"]), {}).get("attributes", {}).get("name", g["id"]) for g in (rel.get("betaGroups", {}).get("data") or [])]
              print(f"build {pv} ({a['version']}) uploaded={a.get('uploadedDate','')[:16]} processing={a.get('processingState')} "
                    f"expired={a.get('expired')} encryption={a.get('usesNonExemptEncryption')} "
                    f"internal={bd.get('internalBuildState')} external={bd.get('externalBuildState')} groups={groups}")
          for g in requests.get(f"{API}/apps/{app['id']}/betaGroups", headers=H, timeout=60).json().get("data", []):
              ga = g["attributes"]
              print(f"beta group: {ga.get('name')} internal={ga.get('isInternalGroup')} allBuilds={ga.get('hasAccessToAllBuilds')}")
              # Tester counts and invite states only: this repo is public, never print names or emails.
              tr = requests.get(f"{API}/betaGroups/{g['id']}/betaTesters", headers=H, params={"limit": 200}, timeout=60)
              if tr.status_code == 200:
                  tl = tr.json().get("data", [])
                  st = {}
                  for t in tl:
                      k = f"{t['attributes'].get('inviteType')}/{t['attributes'].get('state')}"
                      st[k] = st.get(k, 0) + 1
                  print(f"  testers: {len(tl)} {st}")
              else:
                  print(f"  testers: HTTP {tr.status_code}")
          # Provisioning side (Certificates, Identifiers & Profiles). The release
          # workflow mints its App Store profile here; 2026-11-02 this started
          # answering 403 "Unable to find a team with the given Team ID" while
          # the app endpoints above kept working, so it is checked separately.
          r = requests.get(f"{API}/bundleIds", headers=H, params={"filter[identifier]": os.environ["BUNDLE_ID"]}, timeout=60)
          if r.status_code == 200:
              ids = r.json().get("data", [])
              caps = []
              if ids:
                  caps = [c["attributes"]["capabilityType"] for c in requests.get(f"{API}/bundleIds/{ids[0]['id']}/bundleIdCapabilities", headers=H, timeout=60).json().get("data", [])]
              print("provisioning API: ok; bundle id capabilities:", ", ".join(sorted(caps)) or "(none listed)")
              pr = requests.get(f"{API}/profiles", headers=H, params={"filter[profileType]": "IOS_APP_STORE", "limit": 20}, timeout=60).json().get("data", [])
              for p in pr:
                  a = p["attributes"]; print(f"profile: {a.get('name')} state={a.get('profileState')} expires={(a.get('expirationDate') or '')[:10]}")
          else:
              try: detail = r.json()["errors"][0].get("detail", "")
              except Exception: detail = r.text[:200]
              print(f"provisioning API: HTTP {r.status_code} — {detail[:200]}")
          PY
