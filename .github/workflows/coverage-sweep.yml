# Monthly (and on demand): find self-service yards we don't track yet.
# OSM discovery downloads Geofabrik state extracts one at a time and filters
# them with osmium-tool (each file deleted before the next state).
# (scraper/coverage_sweep.py → scraper/coverage_sweep.md / .json) and commit
# the report. Read-only toward the yards: robots.txt respected, honest
# YardScout user agent, one page per site plus at most one inventory page.
# Yards that block us are listed for outreach; nothing works around a block.
# Weekly (owner-requested 2026-11-04), and on dispatch with osm_pending=true:
# an OSM-only pass over the states the last run could not cover
# (scraper/coverage_sweep.json osm_pending). It exits with no commit once the
# list is empty, so most weeks it costs about a minute.
name: Coverage sweep

on:
  schedule:
    - cron: "43 9 3 * *"   # 3rd of each month, 09:43 UTC: full sweep
    - cron: "17 11 * * 1"  # Mondays, 11:17 UTC: OSM-only pass over osm_pending (the Sweep step matches this exact string)
  workflow_dispatch:
    inputs:
      max_sites:
        description: "Most candidate websites to check"
        default: "400"
      osm:
        description: "Include OpenStreetMap discovery (off = Ario only)"
        type: boolean
        default: true
      osm_pending:
        description: "OSM-only pass: query just the states in osm_pending and merge into the report (no Ario)"
        type: boolean
        default: false
      budget_min:
        description: "Time budget in minutes (the job times out at 90)"
        default: "70"
      osm_source:
        description: "OSM discovery source: geofabrik (state extracts + osmium) or overpass"
        type: choice
        options: [geofabrik, overpass]
        default: geofabrik

permissions:
  contents: write

concurrency:
  group: coverage-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests beautifulsoup4 rich cryptography
      - name: Install osmium-tool (Geofabrik extracts are filtered locally)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          osmium --version | head -1
          df -h "$RUNNER_TEMP" /tmp | sed 's/^/disk: /'
      - name: Overpass diagnostics (overpass source only; never fails the job)
        if: ${{ github.event.inputs.osm_source == 'overpass' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scraper/coverage_sweep.py --diagnose
      - name: Sweep
        run: |
          python scraper/coverage_sweep.py --budget-min "${{ github.event.inputs.budget_min || '70' }}" \
            --max-sites "${{ github.event.inputs.max_sites || '400' }}" \
            ${{ github.event.inputs.osm == 'false' && '--no-osm' || '' }} \
            ${{ (github.event.inputs.osm_pending == 'true' || github.event.schedule == '17 11 * * 1') && '--osm-pending' || '' }} \
            --osm-source "${{ github.event.inputs.osm_source || 'geofabrik' }}"
          { echo "## Coverage sweep"; sed -n '1,/^## /p' scraper/coverage_sweep.md | sed '$d'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        run: |
          [ -z "$(git status --porcelain scraper/coverage_sweep.md scraper/coverage_sweep.json)" ] && { echo "nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/coverage_sweep.md scraper/coverage_sweep.json
          git commit -m "chore: coverage sweep $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git -c rebase.autoStash=true pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push"; exit 1
