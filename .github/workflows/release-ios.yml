# Archive the iOS app from the current docs/ shell on a macOS runner and
# upload it to App Store Connect (TestFlight). Optionally also create the
# App Store version with release notes, attach the build and submit it for
# review — the replacement for the by-hand xcodebuild + ASC clicking.
#
# Needs these repository secrets (see RELEASING.md for where each comes from):
#   ASC_KEY_ID                  App Store Connect API key id
#   ASC_ISSUER_ID               its issuer id
#   ASC_API_KEY_P8              the .p8 file's contents
#   IOS_DIST_CERT_P12_BASE64    "Apple Distribution" certificate + private key (.p12), base64
#   IOS_DIST_CERT_P12_PASSWORD  the .p12 password
#   IOS_APPSTORE_PROFILE_BASE64 an "App Store Connect" distribution provisioning
#                               profile for com.benvuolo.yardscout (.mobileprovision), base64
#
# Signing is MANUAL on the runner: the archive is signed with the
# distribution certificate + that App Store profile. (Automatic signing
# wants an Apple Development certificate/profile for the archive step,
# which a CI keychain doesn't have.) The API key is used for the upload.
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.10)"
        required: true
      build_number:
        description: "Build number (must be unique per marketing version). Blank = this workflow's run number"
        default: ""
      notes:
        description: "What's New / TestFlight notes (en-US)"
        required: true
      submit:
        description: "Also create the App Store version and submit for review (otherwise TestFlight only)"
        type: boolean
        default: false
      submit_only:
        description: "Skip build/upload: submit an ALREADY-UPLOADED build (give its build_number) for review"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  archive-upload:
    runs-on: macos-latest
    env:
      TEAM_ID: G23Z9MSBUG
      BUNDLE_ID: com.benvuolo.yardscout
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps + stage the web shell
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          npm ci
          node --check docs/app.js
          ./native/stage.sh
          npx cap sync ios

      - name: Set version
        id: ver
        run: |
          set -euo pipefail
          mv="${{ github.event.inputs.marketing_version }}"
          bn="${{ github.event.inputs.build_number }}"
          if [ -z "$bn" ]; then bn="${{ github.run_number }}"; fi
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $mv;/" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $bn;/" ios/App/App.xcodeproj/project.pbxproj
          echo "mv=$mv" >> "$GITHUB_OUTPUT"
          echo "bn=$bn" >> "$GITHUB_OUTPUT"
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' ios/App/App.xcodeproj/project.pbxproj | sort -u

      - name: Install signing certificate + API key
        if: ${{ github.event.inputs.submit_only != 'true' }}
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_B64" || { echo "::error::IOS_DIST_CERT_P12_BASE64 secret missing"; exit 1; }
          test -n "$ASC_P8" || { echo "::error::ASC_API_KEY_P8 secret missing"; exit 1; }
          KEYCHAIN=$RUNNER_TEMP/ys.keychain-db
          KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          # App Store provisioning profile -> where Xcode looks for it; its
          # UUID/name are read back for the manual-signing build settings.
          test -n "$PROFILE_B64" || { echo "::error::IOS_APPSTORE_PROFILE_BASE64 secret missing (see RELEASING.md)"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) for $PROFILE_APPID"
          case "$PROFILE_APPID" in *"$BUNDLE_ID") ;; *) echo "::error::profile is for $PROFILE_APPID, not $BUNDLE_ID"; exit 1;; esac
          cp "$RUNNER_TEMP/appstore.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_ENV"
          # xcodebuild looks for API keys in ~/.appstoreconnect/private_keys/.
          # The secret may have been pasted with lost newlines, as a single
          # line, or base64-encoded — rebuild a clean PEM from any of those.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 - "$KEY_FILE" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ["ASC_P8"].strip().replace("\r", "")
          raw = raw.replace("\\n", "\n")          # literal backslash-n from some paste paths
          def body_of(txt):
              m = re.search(r"-----BEGIN[^-]*-----(.*?)-----END", txt, re.S)
              return re.sub(r"\s+", "", m.group(1)) if m else None
          body = body_of(raw)
          if body is None:
              compact = re.sub(r"\s+", "", raw)
              try:
                  dec = base64.b64decode(compact, validate=True)
                  inner = body_of(dec.decode("utf-8", "ignore"))
                  body = inner if inner else compact   # base64 of a PEM, or bare DER base64
              except Exception:
                  body = compact
          try:
              base64.b64decode(body, validate=True)
          except Exception:
              print("::error::ASC_API_KEY_P8 is not a PEM/base64 private key — paste the AuthKey_*.p8 file contents"); sys.exit(1)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          PY
          openssl pkey -in "$KEY_FILE" -noout 2>/dev/null && echo "API key PEM ok" || { echo "::error::ASC_API_KEY_P8 did not parse as a private key"; exit 1; }
          echo "key_path=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Archive
        if: ${{ github.event.inputs.submit_only != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            | tail -40

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ github.event.inputs.submit_only != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$profile_name</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -30

      - name: Commit version bump
        if: ${{ github.event.inputs.submit_only != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App.xcodeproj/project.pbxproj
          git commit -m "chore(release): iOS ${{ steps.ver.outputs.mv }} build ${{ steps.ver.outputs.bn }}${{ github.event.inputs.submit == 'true' && ' (submitted)' || ' (TestFlight)' }}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          echo "::error::could not push the version bump"; exit 1

      # Apple takes ~10-40 minutes to process an upload. deliver needs the
      # processed build to attach it, so poll (up to ~60 min) before
      # creating the version, setting What's New and submitting.
      - name: Create App Store version + submit for review
        if: ${{ github.event.inputs.submit == 'true' || github.event.inputs.submit_only == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
          BUILD_NUMBER: ${{ steps.ver.outputs.bn || github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$BUILD_NUMBER" || { echo "::error::submit_only needs build_number"; exit 1; }
          # Homebrew's python is externally managed; use a throwaway venv.
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography requests
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, time, jwt, requests
          key = os.environ["ASC_P8"].strip().replace("\\n", "\n")
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          API = "https://api.appstoreconnect.apple.com/v1"
          apps = requests.get(f"{API}/apps", headers=H, params={"filter[bundleId]": os.environ["BUNDLE_ID"]}, timeout=60).json()
          app_id = apps["data"][0]["id"]
          # Apple allows one submission in the queue at a time: withdraw any
          # pending one so the new version can take its place (an in-review
          # build that is superseded would be rejected anyway).
          subs = requests.get(f"{API}/apps/{app_id}/reviewSubmissions", headers=H,
                              params={"filter[state]": "READY_FOR_REVIEW,WAITING_FOR_REVIEW,IN_REVIEW,UNRESOLVED_ISSUES"},
                              timeout=60).json().get("data", [])
          for sub in subs:
              r = requests.patch(f"{API}/reviewSubmissions/{sub['id']}", headers=H, timeout=60,
                                 json={"data": {"type": "reviewSubmissions", "id": sub["id"], "attributes": {"canceled": True}}})
              print("withdrew review submission", sub["id"], sub["attributes"].get("state"), "->", r.status_code)
          if not subs:
              print("no pending review submission to withdraw")
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_P8"], "in_house": False},
                    open(os.environ["RUNNER_TEMP"] + "/asc_key.json", "w"))
          PY
          sleep 20
          # Listing text lives in fastlane/metadata/en-US (see fastlane/README.md);
          # screenshots in fastlane/screenshots/en-US when present. Both go up
          # with the version, then it is submitted.
          mkdir -p fastlane/metadata/en-US
          printf '%s\n' "${{ github.event.inputs.notes }}" > fastlane/metadata/en-US/release_notes.txt
          SHOTS="--skip_screenshots"
          if ls fastlane/screenshots/en-US/*.png >/dev/null 2>&1; then SHOTS="--skip_screenshots false --overwrite_screenshots --screenshots_path fastlane/screenshots"; fi
          for attempt in $(seq 1 12); do
            if fastlane deliver --api_key_path "$RUNNER_TEMP/asc_key.json" \
                --app_identifier "$BUNDLE_ID" --team_id "$TEAM_ID" \
                --app_version "${{ github.event.inputs.marketing_version }}" --build_number "$BUILD_NUMBER" \
                --skip_binary_upload --skip_metadata false --metadata_path fastlane/metadata $SHOTS \
                --skip_app_version_update false \
                --precheck_include_in_app_purchases false --run_precheck_before_submit false \
                --submit_for_review --automatic_release --force; then
              echo "submitted ${{ github.event.inputs.marketing_version }} ($BUILD_NUMBER)"; exit 0
            fi
            echo "build not processed yet or submit failed (attempt $attempt/12) — retrying in 5 min"
            sleep 300
          done
          echo "::error::could not submit after 60 min — the build is uploaded; submit from App Store Connect or re-run with submit=true later"
          exit 1
