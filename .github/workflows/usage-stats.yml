# Read-only usage snapshot from production D1: aggregate counts only (no
# emails, device ids, tokens or watch contents). Manual trigger.
name: Usage stats
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve account
        run: |
          acct=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json;print(json.load(sys.stdin)["result"][0]["id"])')
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
      - name: Query
        working-directory: backend
        run: |
          q() { echo "=== $1"; npx --yes wrangler@4 d1 execute yardscout-db --remote --json --command "$2" 2>/dev/null | python3 -c 'import sys,json
          d=json.load(sys.stdin)
          for r in d[0]["results"]: print("  ", json.dumps(r))'; }
          q "devices by platform/tier (push-ready)" "SELECT platform, tier, COUNT(*) n, SUM(CASE WHEN apns_token IS NOT NULL OR fcm_token IS NOT NULL THEN 1 ELSE 0 END) push_ready, SUM(CASE WHEN watches_json IS NOT NULL AND watches_json NOT IN ('[]','') THEN 1 ELSE 0 END) with_watches, SUM(CASE WHEN saved_json IS NOT NULL AND saved_json NOT IN ('[]','') THEN 1 ELSE 0 END) with_saved FROM devices GROUP BY platform, tier"
          q "device watch totals" "SELECT SUM(json_array_length(watches_json)) watches, SUM(CASE WHEN json_array_length(watches_json)>0 THEN 1 ELSE 0 END) devices_with_watches FROM devices WHERE watches_json IS NOT NULL AND json_valid(watches_json)"
          q "new devices per day (14d)" "SELECT substr(created_at,1,10) day, platform, COUNT(*) n FROM devices WHERE created_at >= date('now','-14 day') GROUP BY day, platform ORDER BY day"
          q "devices active (synced) last 7d / 30d" "SELECT SUM(updated_at >= datetime('now','-7 day')) d7, SUM(updated_at >= datetime('now','-30 day')) d30 FROM devices"
          q "most-watched makes/models (top 25)" "SELECT json_extract(w.value,'$.make') make, json_extract(w.value,'$.model') model, COUNT(*) n FROM devices d, json_each(d.watches_json) w WHERE json_valid(d.watches_json) GROUP BY make, model ORDER BY n DESC LIMIT 25"
          q "web accounts by tier" "SELECT tier, COUNT(*) n, SUM(last_login_at >= datetime('now','-30 day')) active_30d FROM users GROUP BY tier"
          q "web account watches" "SELECT COUNT(*) watches, COUNT(DISTINCT user_id) users FROM watches"
          q "email-alert watchers" "SELECT enabled, COUNT(*) n FROM email_watchers GROUP BY enabled"
          q "alerts sent (14d): device / web push / email" "SELECT 'device' ch, COUNT(*) n FROM device_alerts_sent WHERE sent_at >= datetime('now','-14 day') UNION ALL SELECT 'webpush', COUNT(*) FROM alerts_sent WHERE sent_at >= datetime('now','-14 day') UNION ALL SELECT 'email', COUNT(*) FROM email_alerts_sent WHERE sent_at >= datetime('now','-14 day')"
          q "funnel events (14d totals)" "SELECT event, platform, SUM(n) n FROM events_daily WHERE day >= date('now','-14 day') GROUP BY event, platform ORDER BY n DESC LIMIT 40"
          q "pro sheet by gate (14d): paywall/ checkout/ purchase/" "SELECT event, SUM(n) n FROM events_daily WHERE day >= date('now','-14 day') AND (event LIKE 'paywall/%' OR event LIKE 'checkout/%' OR event LIKE 'purchase/%') GROUP BY event ORDER BY n DESC LIMIT 40"
          q "funnel by source (14d)" "SELECT source, campaign, event, SUM(n) n FROM events_daily WHERE day >= date('now','-14 day') AND source != '' GROUP BY source, campaign, event ORDER BY n DESC LIMIT 30"
          q "first-visit per day (14d)" "SELECT day, platform, SUM(n) n FROM events_daily WHERE event='first-visit' AND day >= date('now','-14 day') GROUP BY day, platform ORDER BY day"
          q "pro devices by first-seen day" "SELECT substr(created_at,1,10) first_seen, platform, COUNT(*) n, SUM(updated_at >= datetime('now','-7 day')) active_7d FROM devices WHERE tier='pro' GROUP BY first_seen, platform ORDER BY first_seen"
          q "coverage/yard requests (30d)" "SELECT kind, COUNT(*) n FROM coverage_requests WHERE created_at >= datetime('now','-30 day') GROUP BY kind"
          q "coverage/yard requests, details (30d; email shown only as yes/no)" "SELECT created_at, kind, year, make, model, part, zip, note, CASE WHEN email IS NOT NULL AND email != '' THEN 'yes' ELSE 'no' END wants_reply FROM coverage_requests WHERE created_at >= datetime('now','-30 day') ORDER BY created_at DESC LIMIT 40"
      # Real App Store numbers (Sales and Trends). The app's own Pro flag can't
      # tell paying users from TestFlight/sandbox or review devices; Apple's
      # report can. Needs the ASC_VENDOR_NUMBER secret (App Store Connect →
      # Payments and Financial Reports, the number shown next to your name).
      - name: App Store sales (last 14 days)
        env:
          # A read-only "Sales" role key (ASC_SALES_KEY_ID + ASC_SALES_P8) if set;
          # the release key's role can't read Sales and Trends.
          ASC_KEY_ID: ${{ secrets.ASC_SALES_KEY_ID || secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_SALES_P8 || secrets.ASC_API_KEY_P8 }}
          VENDOR: ${{ secrets.ASC_VENDOR_NUMBER }}
        run: |
          if [ -z "$VENDOR" ]; then
            echo "Skipped: add the ASC_VENDOR_NUMBER repo secret (App Store Connect → Payments and Financial Reports → number next to your name)."
            exit 0
          fi
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import csv, datetime as dt, gzip, io, os, time, jwt, requests
          key = os.environ["ASC_P8"].strip().replace("\\n", "\n")
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {tok}", "Accept": "application/a-gzip"}
          URL = "https://api.appstoreconnect.apple.com/v1/salesReports"
          def report(kind, sub, ver, day):
              r = requests.get(URL, headers=H, timeout=60, params={"filter[frequency]": "DAILY", "filter[reportType]": kind,
                  "filter[reportSubType]": sub, "filter[vendorNumber]": os.environ["VENDOR"], "filter[reportDate]": day, "filter[version]": ver})
              if r.status_code == 404: return []          # no activity that day (or not published yet)
              if r.status_code == 403:
                  raise SystemExit("App Store Connect: this API key's role can't read sales. Create a key with the Sales role "
                                   "(Users and Access → Integrations) and add it as ASC_SALES_KEY_ID + ASC_SALES_P8.")
              if r.status_code != 200: raise SystemExit(f"{kind} {day}: HTTP {r.status_code} {r.text[:300]}")
              return list(csv.DictReader(io.StringIO(gzip.decompress(r.content).decode()), delimiter="\t"))
          DOWNLOAD = {"1", "1F", "1T", "F1"}
          tot = {"downloads": 0, "sub_units": 0, "proceeds": 0.0}
          print("day         downloads  subscription units (new+renewals)  proceeds")
          today = dt.date.today()
          for i in range(14, 0, -1):
              day = (today - dt.timedelta(days=i)).isoformat()
              rows = report("SALES", "SUMMARY", "1_1", day)
              d = sum(int(r["Units"]) for r in rows if r["Product Type Identifier"] in DOWNLOAD)
              s = [r for r in rows if r["Product Type Identifier"].startswith("IA")]
              u = sum(int(r["Units"]) for r in s)
              p = sum(float(r["Developer Proceeds"] or 0) * int(r["Units"]) for r in s)
              tot["downloads"] += d; tot["sub_units"] += u; tot["proceeds"] += p
              print(f"{day}  {d:>9}  {u:>34}  {p:>8.2f}")
          print(f"TOTAL       {tot['downloads']:>9}  {tot['sub_units']:>34}  {tot['proceeds']:>8.2f}  (proceeds in each row's currency, mostly USD)")
          for i in range(1, 5):   # newest published subscription snapshot
              day = (today - dt.timedelta(days=i)).isoformat()
              rows = report("SUBSCRIPTION", "SUMMARY", "1_4", day)
              if rows:
                  act = sum(int(r.get("Active Standard Price Subscriptions") or 0) for r in rows)
                  trial = sum(int(r.get("Active Free Trial Introductory Offer Subscriptions") or 0) for r in rows)
                  print(f"Active paid subscriptions on {day}: {act}" + (f" (+{trial} in free trial)" if trial else ""))
                  break
          else:
              print("Active subscriptions: no SUBSCRIPTION report in the last 4 days (none active, or not published yet).")
          PY
