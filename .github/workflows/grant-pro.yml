# Goes through the API Worker (same entitlement store as the site Worker):
# yardscout.io's bot protection challenges GitHub's runners.
# Give a friend Pro (or take it back) without touching a Mac or the
# dashboard. Needs the ENT_ADMIN_SECRET repository secret (same value the
# deploy workflow mirrors into the yardscout-site Worker).
#
#   gh workflow run grant-pro.yml -f email=friend@example.com -f months=12 -f note="college buddy"
#   gh workflow run grant-pro.yml -f email=friend@example.com -f revoke=true
#
# The friend then unlocks like any Pro member: Pro sheet → "Already have
# Pro?" → their email → 6-digit code (web, iPhone or Android).
name: Grant Pro

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Friend's email (the one they'll type into the app)"
        required: true
      months:
        description: "How long (months). Blank = no expiry"
        default: "12"
      note:
        description: "Who / why (kept in the entitlement's audit history)"
        default: "owner comp"
      revoke:
        description: "Take Pro away instead"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    env:
      ENT_ADMIN_SECRET: ${{ secrets.ENT_ADMIN_SECRET }}
    steps:
      # This repo is public, so its run logs are too. The email is read from
      # the event file (never interpolated into a command or env header) and
      # masked before anything can print it; the response is reduced to a
      # status line.
      - name: Mask the email
        run: |
          set -euo pipefail
          EMAIL=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH")
          test -n "$EMAIL" || { echo "::error::email input missing"; exit 1; }
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$(printf '%s' "$EMAIL" | tr '[:upper:]' '[:lower:]')"
          { echo "IN_EMAIL<<__EOF__"; echo "$EMAIL"; echo "__EOF__"; } >> "$GITHUB_ENV"
      - name: Grant
        run: |
          set -euo pipefail
          test -n "$ENT_ADMIN_SECRET" || { echo "::error::ENT_ADMIN_SECRET secret missing"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]
          body = {"email": os.environ["IN_EMAIL"], "note": ev.get("note") or "owner comp",
                  "revoke": str(ev.get("revoke")).lower() == "true"}
          months = str(ev.get("months") or "").strip()
          if months: body["months"] = int(months)
          req = urllib.request.Request("https://yardscout-api.yardscout.workers.dev/v1/admin/ent/grant", data=json.dumps(body).encode(),
                                       headers={"content-type": "application/json", "x-ent-admin": os.environ["ENT_ADMIN_SECRET"], "user-agent": "YardScout-GrantPro/1.0 (+https://yardscout.io; GitHub Actions)"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read().decode())
                  print(f"ok={d.get('ok')} pro={d.get('pro')} expiresAt={d.get('expiresAt')} source={d.get('source')}")
          except urllib.error.HTTPError as e:
              print("::error::grant failed, HTTP", e.code); raise SystemExit(1)
          PY
