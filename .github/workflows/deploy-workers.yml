# Deploy the Cloudflare Workers from CI so no Mac session is needed:
#   yardscout-api   (backend/)            — D1 migrations, then deploy
#   yardscout-site  (backend/site-proxy/) — yardscout.io proxy + share pages
#
# Runs on every push to main that touches backend/, or by hand.
# Needs one repository secret (see README-BACKEND.md → "Deploying from CI"):
#   CLOUDFLARE_API_TOKEN   API token with "Workers Scripts: Edit", "D1: Edit",
#                          "Workers KV Storage: Edit", "Workers Routes: Edit"
#                          and "Account Settings: Read" (Account → API Tokens →
#                          Create → "Edit Cloudflare Workers" template + D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  optional — only needed if the token sees several accounts
# Worker secrets (STRIPE_*, APNS_*, …) are NOT touched: they live in
# Cloudflare and survive deploys.
name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which Worker"
        type: choice
        options: [both, api, site]
        default: both
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-workers.yml"

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event.inputs.target || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The token can list its own accounts, so the account id is resolved
      # here (the optional CLOUDFLARE_ACCOUNT_ID secret only disambiguates
      # when the token sees more than one account).
      - name: Resolve account
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          ids=$(curl -sfS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
                | python3 -c 'import json,sys; print("\n".join(a["id"] for a in json.load(sys.stdin)["result"]))')
          n=$(printf '%s\n' "$ids" | grep -c .)
          if [ "$n" -eq 1 ]; then acct="$ids";
          elif printf '%s\n' "$ids" | grep -qx "$CLOUDFLARE_ACCOUNT_ID"; then acct="$CLOUDFLARE_ACCOUNT_ID";
          else echo "::error::token sees $n accounts and CLOUDFLARE_ACCOUNT_ID matches none of them"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
          echo "account resolved (${#acct} chars)"
      - name: Deploy yardscout-api (migrations + worker)
        if: env.TARGET == 'both' || env.TARGET == 'api'
        working-directory: backend
        run: |
          node --check src/index.js
          npx --yes wrangler@4 d1 migrations apply yardscout-db --remote
          npx --yes wrangler@4 deploy
      # Owner-comp secret for the API Worker's /v1/admin/ent/grant route.
      - name: Sync ENT_ADMIN_SECRET to yardscout-api
        if: (env.TARGET == 'both' || env.TARGET == 'api') && env.ENT_ADMIN_SECRET != ''
        working-directory: backend
        env:
          ENT_ADMIN_SECRET: ${{ secrets.ENT_ADMIN_SECRET }}
        run: printf '%s' "$ENT_ADMIN_SECRET" | npx --yes wrangler@4 secret put ENT_ADMIN_SECRET
      # GitHub token for the API Worker's hourly scan watchdog (fine-grained,
      # benvuolo/yardscout, Actions: Read and write). Skipped until set.
      - name: Sync SCAN_DISPATCH_TOKEN to yardscout-api
        if: (env.TARGET == 'both' || env.TARGET == 'api') && env.SCAN_DISPATCH_TOKEN != ''
        working-directory: backend
        env:
          SCAN_DISPATCH_TOKEN: ${{ secrets.SCAN_DISPATCH_TOKEN }}
        run: printf '%s' "$SCAN_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put SCAN_DISPATCH_TOKEN
      - name: Deploy yardscout-site
        if: env.TARGET == 'both' || env.TARGET == 'site'
        working-directory: backend/site-proxy
        run: |
          node --check src/index.js
          npx --yes wrangler@4 deploy
      # Owner-comp secret: mirrored from the GitHub secret so granting Pro
      # never needs a Mac. Skipped when the GitHub secret isn't set.
      - name: Sync ENT_ADMIN_SECRET to yardscout-site
        if: (env.TARGET == 'both' || env.TARGET == 'site') && env.ENT_ADMIN_SECRET != ''
        working-directory: backend/site-proxy
        env:
          ENT_ADMIN_SECRET: ${{ secrets.ENT_ADMIN_SECRET }}
        run: printf '%s' "$ENT_ADMIN_SECRET" | npx --yes wrangler@4 secret put ENT_ADMIN_SECRET
      - name: Smoke
        run: |
          curl -sfS https://yardscout-api.yardscout.workers.dev/v1/health
          # yardscout.io sits behind Cloudflare's bot filtering, which may
          # challenge a bare curl from a datacenter IP — report, don't fail.
          curl -s -o /dev/null -w "site %{http_code}\n" https://yardscout.io/ || true
