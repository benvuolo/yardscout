# Weekly autonomous parts research: takes the top unresearched coverage gaps
# (ranked monthly by coverage-mine.yml), asks an LLM for flip-worthy parts with
# conservative prices, validates hard (see scraper/research_parts.py), and
# commits the survivors to scraper/parts_overlay.json — which every scan merges
# into the parts knowledge base. Runs forever with zero prompting; costs a few
# cents per run. Needs ANTHROPIC_API_KEY or OPENAI_API_KEY as a repo secret;
# without one the job logs "not configured" and exits green.

name: Weekly Parts Research

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      groups:
        description: "Max vehicle groups to research this run"
        default: "4"

permissions:
  contents: write

concurrency:
  group: parts-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Research parts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scraper/research_parts.py --groups "${{ github.event.inputs.groups || '4' }}"

      - name: Commit overlay
        run: |
          git config user.name "yardscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/parts_overlay.json scraper/parts_research_log.md
          if git diff --staged --quiet; then
            echo "No new parts this run."
            exit 0
          fi
          git commit -m "chore: weekly parts research (auto)"
          git pull --rebase origin main
          git push origin main
