# OEM fitment crawl (scraper/oem_fitment/README.md). One job per hosting
# PLATFORM (scraper/oem_fitment/platforms.py; today every catalog site is on
# the SimplePart platform, so one job). A job crawls its sites one at a time in
# round-robin turns, resuming each from the oem-raw branch, through fetch.py
# (allowlist, robots.txt, 8 s per site AND 8 s per platform, permanent stop
# on any bot check / 403 / 429 / 503, refusals logged with request counts in
# raw/<site>.refusals.jsonl), and commits raw/<site>.* back to oem-raw after
# every turn, so a killed job loses at most one turn. raw/<site>.* covers the records
# (<site>.jsonl), the R1/R2 manifests (<site>.lists.jsonl, <site>.years.jsonl;
# CURATION_SPEC.md §3.2), any size-capped continuation part (<site>.2.jsonl,
# <site>.lists.2.jsonl, ...), .progress.json, .log, .done, .blocked and
# .paused; both cp lines below restore and checkpoint all of them, and
# ci_audit.py --site reads every records part (rawparts.py). Sites with
# their finish marker (raw/<site>.done, or raw/<site>.vN.done for a worklist
# entry with "version": N; markers.py), .blocked or .paused on oem-raw are skipped. Never touches main.
name: OEM fitment crawl

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated catalog domains, or all"
        default: "all"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

# One crawl run at a time, enforced: a scheduled or manual run that starts
# while another is active waits until it finishes. (2026-11-05: the 07:02
# scheduled run overlapped the 02:43 manual run, ~14 sites crawled at once,
# and three catalogs answered HTTP 503 within four minutes.)
concurrency:
  group: oem-fitment-crawl-global
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
      nplat: ${{ steps.list.outputs.nplat }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          WANT: ${{ github.event.inputs.sites || 'all' }}
        run: |
          git fetch -q origin oem-raw:oem-raw 2>/dev/null || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          from pathlib import Path
          want = os.environ["WANT"].strip()
          sites = []
          for f in sorted(Path("scraper/oem_fitment/sites").glob("*.py")):
              if f.name.startswith("_"):
                  continue
              m = re.search(r'^SITE\s*=\s*"([^"]+)"', f.read_text(), re.M)
              if m:
                  sites.append(m.group(1))
          if want != "all":
              sites = [s for s in sites if s in {x.strip() for x in want.split(",")}]
          def on_branch(path):
              return subprocess.run(["git", "cat-file", "-e", f"oem-raw:{path}"],
                                    capture_output=True).returncode == 0
          # finish marker per worklist version (markers.py): raising a site's
          # "version" re-opens it without deleting the earlier .done
          import sys
          sys.path.insert(0, "scraper/oem_fitment")
          import markers
          wl = json.loads(Path("scraper/oem_fitment/worklist.json").read_text()).get("sites", {})
          # markers.mode: "crawl" until the worklist's .done, then "complete"
          # while an R3 completion pass ("complete" in worklist.json) has no
          # raw/<site>.cN.done; .blocked / .paused stop both for good
          sites = [s for s in sites if markers.mode(s, wl.get(s), lambda n: on_branch("raw/" + n))]
          # one matrix entry per hosting PLATFORM (platforms.py, hub
          # 2026-11-10): the dealer stores are one platform, so per-site jobs
          # multiplied its load (07:10-07:16 three 503s with six jobs live)
          import platforms
          groups = platforms.groups(sites)
          print("groups=" + json.dumps(groups))
          print("nplat=" + str(max(1, len(groups))))
          PY
          cat "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # One job per hosting platform (platforms.py). The SimplePart job crawls
      # its sites one at a time in round-robin turns, so the whole platform
      # gets one site's pace (fetch.py PER_DOMAIN_GAP 8 s, plus the
      # platform-wide PLATFORM_GAP lock), i.e. what a single site got before
      # 2026-11-05. History: 2026-11-05 ~14 separate runs (~3.5 req/s) drew
      # a 403 and a 503; 2026-11-10 six per-site jobs drew three 503s.
      max-parallel: ${{ fromJSON(needs.plan.outputs.nplat) }}
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    concurrency:
      group: oem-crawl-platform-${{ matrix.group.platform }}
      cancel-in-progress: false
    env:
      PLATFORM_JOB: ${{ matrix.group.platform }}
      SITES: ${{ matrix.group.sites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - name: Restore progress from oem-raw
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          W="$GITHUB_WORKSPACE/../raw-branch"
          if git fetch -q origin oem-raw; then
            git worktree add -q --detach "$W" FETCH_HEAD
          else
            git worktree add -q --orphan -b oem-raw "$W"
          fi
          mkdir -p "$W/raw" scraper/oem_fitment/raw
          for SITE in $SITES; do
            cp "$W"/raw/"$SITE".* scraper/oem_fitment/raw/ 2>/dev/null || true
          done
          ls -la scraper/oem_fitment/raw/
      - name: Crawl the platform's sites in round-robin turns, checkpoint after each
        run: |
          W="$GITHUB_WORKSPACE/../raw-branch"
          push_raw() {
            cp "$GITHUB_WORKSPACE"/scraper/oem_fitment/raw/"$1".* "$W/raw/" 2>/dev/null || true
            ( cd "$W"
              git add raw
              if git diff --cached --quiet; then exit 0; fi
              git commit -q -m "oem-raw: $1 checkpoint $(date -u +%Y-%m-%dT%H:%MZ)"
              for t in 1 2 3 4 5 6; do
                git push -q origin HEAD:oem-raw && exit 0
                git fetch -q origin oem-raw && git rebase -q FETCH_HEAD || git rebase --abort || true
                sleep $((t * 5))
              done
              echo "::error::could not push checkpoint"; exit 1 )
          }
          cd scraper/oem_fitment
          # turn order rotates with the run number (platforms.rotation) so no
          # site is starved when the budget ends mid-round; turn length fits
          # one round of the platform's sites into the budget
          ORDER=$(python3 -c "import os, platforms; print(' '.join(platforms.rotation(os.environ['SITES'].split(), int(os.environ['GITHUB_RUN_NUMBER']))))")
          N=$(echo $ORDER | wc -w)
          TURN=$(python3 -c "import platforms; print(platforms.slice_minutes($N))")
          echo "platform $PLATFORM_JOB: $N sites, $TURN-minute turns: $ORDER"
          START=$(date +%s)
          BUDGET=$((320 * 60))
          while :; do
            active=0
            for SITE in $ORDER; do
              export SITE
              if [ $(( $(date +%s) - START )) -ge $BUDGET ]; then break 2; fi
              # markers.mode per turn: "crawl" (worklist), "complete" (R3), or none;
              # .blocked / .paused written in an earlier turn stop the site
              MODE=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          import markers
          s = os.environ["SITE"]
          wl = json.loads(Path("worklist.json").read_text()).get("sites", {}).get(s)
          print(markers.mode(s, wl, lambda n: Path("raw", n).exists()) or "none")
          PY
              )
              if [ "$MODE" = "none" ]; then continue; fi
              active=1
              echo "== $SITE: mode $MODE, turn $TURN min"
              ARGS=""
              if [ "$MODE" = "complete" ]; then ARGS="--complete auto"; fi
              set +e
              python3 crawl.py --site "$SITE" --minutes "$TURN" $ARGS
              rc=$?
              set -e
              tail -2 "raw/$SITE.log" 2>/dev/null || true
              # offline evidence audit of everything crawled so far; a parser
              # bug (>0.5% mismatches) pauses the site for human review
              set +e
              python3 ci_audit.py --site "$SITE" | tee -a "$GITHUB_STEP_SUMMARY"
              arc=${PIPESTATUS[0]}
              set -e
              if [ "$arc" -eq 20 ]; then
                echo "evidence mismatch above 0.5%: paused for review $(date -u +%FT%TZ)" > "raw/$SITE.paused"
                echo "::error::$SITE paused by the evidence audit"
              fi
              push_raw "$SITE"
              # 10 = time budget reached (turn over), 11 = network-failure
              # streak (cool down, next site), anything else = site finished
              # or stopped for this run
              if [ "$rc" -eq 11 ]; then sleep 120; fi
              { echo "## $SITE (rc $rc)"; echo '```'; tail -3 "raw/$SITE.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            done
            if [ "$active" -eq 0 ]; then echo "platform $PLATFORM_JOB: nothing left this run"; break; fi
          done
