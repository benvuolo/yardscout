# YardScout API — Cloudflare Worker configuration.
#
# Owner setup (see README-BACKEND.md for the full walkthrough):
#   1. npx wrangler login
#   2. npx wrangler d1 create yardscout-db
#      → paste the printed database_id below (replace the placeholder)
#   3. npx wrangler d1 migrations apply yardscout-db --remote
#   4. Set secrets (never in this file!):
#        npx wrangler secret put UPLOAD_TOKEN
#        npx wrangler secret put ADMIN_SECRET
#        npx wrangler secret put RESEND_API_KEY
#        npx wrangler secret put APNS_P8      (paste the whole AuthKey_*.p8 file)
#   5. npm run deploy

name = "yardscout-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Weekly digest email for free users (Mondays 15:00 UTC ≈ 9am Mountain).
# Deploys automatically with `npm run deploy` — no dashboard setup needed.
[triggers]
crons = ["0 15 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "yardscout-db"
database_id = "b81475d5-a998-4ede-8d43-b0932f8e236a"

# Pro entitlements KV — the SAME namespace the yardscout-site Worker owns
# (backend/site-proxy/wrangler.toml). Bound here so email-alert sync can
# resolve device tokens (tok:<token> → email) and dispatch can re-check the
# entitlement (ent:<email>) at send time. This Worker treats it as read-only
# in production paths (the DEV-only test seam writes to the local emulator).
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "deb0d4c244fb4eb09a109050000d0e1b"

[vars]
# Comma-separated list of browser origins allowed to call this API (CORS).
# capacitor://localhost = the iOS app's webview; https://localhost = the
# ANDROID app's webview (Capacitor's androidScheme default differs by OS).
APP_ORIGINS = "https://yardscout.io,https://benvuolo.github.io,capacitor://localhost,https://localhost,http://localhost:8765,http://127.0.0.1:8765"
# Where the magic-link callback redirects back to (the PWA).
APP_URL = "https://yardscout.io/"
# Sender for magic-link and free weekly-digest emails. Must be on a domain
# verified in Resend: the shared onboarding@resend.dev sender only delivers
# to the Resend account's own address (2026-10-29: free digests and sign-in
# links were silently going nowhere for everyone else).
EMAIL_FROM = "YardScout <hello@yardscout.io>"
# Sender for Pro email alerts (yardscout.io is verified in Resend).
EMAIL_ALERTS_FROM = "YardScout Alerts <alerts@yardscout.io>"
# Owner inbox for the coverage-request digest (Parts tab "ask us to add it").
# Max one email per day, sent on the first inventory commit after new requests.
OWNER_EMAIL = "yardscout.io@gmail.com"
# Public URL of THIS Worker — unsubscribe links in alert emails point here.
API_PUBLIC_URL = "https://yardscout-api.yardscout.workers.dev"
# "1" = magic links are logged + returned in the API response instead of
# emailed. NEVER enable in production. (.dev.vars sets this for local dev.)
DEV_MODE = "0"

# Web Push (VAPID) — generate once with `node backend/scripts/gen-vapid.mjs`.
# The public key is safe to commit; the private JWK is a secret (below).
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:change-me@example.com"

# APNs (native iOS push) — all four required before native push turns on.
# Create the key at developer.apple.com > Certificates, IDs & Profiles > Keys
# (Apple Push Notifications service). Team id is on the membership page.
APNS_TEAM_ID = "G23Z9MSBUG"
APNS_KEY_ID = "53ZHWL335J"
APNS_BUNDLE_ID = "com.benvuolo.yardscout"
# Dev/TestFlight builds talk to the sandbox gateway; App Store builds use
# production. Flip to "production" at launch.
APNS_ENV = "production"

# FCM (native Android push, HTTP v1) — all three required (third is the
# FCM_SA_KEY secret below). The service account is yardscout-fcm-sender in
# the yardscout-play GCP project, role "Firebase Cloud Messaging API Admin"
# only (console.cloud.google.com > IAM > Service Accounts). Rotating the key
# = mint a new JSON key there and re-put the secret.
FCM_PROJECT_ID = "yardscout-play"
FCM_SA_EMAIL = "yardscout-fcm-sender@yardscout-play.iam.gserviceaccount.com"

# Stripe price IDs (create in the Stripe dashboard, then paste here):
#   Pro    — recurring monthly price ($12.99/mo)
#   Pass   — one-time price ($6.99, grants 72h of Pro)
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_PASS = ""

# Secrets expected at runtime (set via `wrangler secret put`, or .dev.vars locally):
#   UPLOAD_TOKEN              — bearer for the scan workflow's inventory pushes
#   ADMIN_SECRET              — protects /v1/admin/* (grant Pro, list users)
#   RESEND_API_KEY            — Resend API key for magic-link emails
#   STRIPE_SECRET_KEY         — Stripe secret key (sk_test_... then sk_live_...)
#   STRIPE_WEBHOOK_SECRET     — signing secret for the /v1/stripe/webhook endpoint
#   VAPID_PRIVATE_JWK         — Web Push private key JSON (from gen-vapid.mjs)
#   APNS_P8                   — contents of the AuthKey_<KEY_ID>.p8 file (native iOS push)
#   FCM_SA_KEY                — the FCM service account's private_key (PKCS#8 PEM from
#                               the JSON key file; literal "\n" escapes accepted) (Android push)
#   EMAIL_UNSUB_SECRET        — HMAC key signing one-click unsubscribe links in alert emails
#   REVENUECAT_WEBHOOK_SECRET — (later) RevenueCat webhook authorization value
